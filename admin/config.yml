# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: bytesofconnor/bytesofconnor-site
  branch: main
  auth_methods:
    - token

site_url: https://flowconnor.dev
display_url: https://flowconnor.dev

media_folder: images/uploads
public_folder: /images/uploads

collections:
  - name: posts
    label: Blog
    label_singular: Post
    folder: posts
    create: true
    extension: md
    format: yaml-frontmatter
    slug: '{{slug}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, time_format: false }
      - { label: Summary, name: description, widget: text, required: false, hint: "Used as the preview text when the link is pasted into X, iMessage, or Slack." }
      - { label: Share image, name: image, widget: image, required: false, hint: "Optional. 1200×630 looks right on X. A site photo is used if this is empty." }
      - { label: Draft, name: draft, widget: boolean, default: false }
      - { label: Body, name: body, widget: richtext }
