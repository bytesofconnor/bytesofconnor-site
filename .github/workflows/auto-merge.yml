# Same-repo auto-merge. pull_request only, never pull_request_target.
# --auto waits for the required checks status; this job does not deploy.

name: Auto-merge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: auto-merge
    runs-on: ubuntu-latest
    steps:
      - name: Enable squash auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [[ -z "${HEAD_REPO}" || "${HEAD_REPO}" != "${BASE_REPO}" ]]; then
            echo "skip: head repo is not the base repo"
            exit 0
          fi

          if ! merge_output="$(gh pr merge "${PR_NUMBER}" --repo "${BASE_REPO}" --auto --squash 2>&1)"; then
            printf '%s\n' "${merge_output}"
            if printf '%s\n' "${merge_output}" | grep -qi 'already enabled'; then
              exit 0
            fi
            exit 1
          fi
          printf '%s\n' "${merge_output}"
